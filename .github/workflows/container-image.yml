name: container-image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag. Defaults to the Cargo workspace version."
        required: false
        type: string
      push_latest:
        description: "Also publish the latest tag."
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  WASM_TARGET: wasm32-unknown-unknown

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image metadata
        id: meta
        shell: bash
        run: |
          VERSION="$(awk -F' *= *' '/^version = / {gsub(/"/,"",$2); print $2; exit}' Cargo.toml)"
          TAG="${{ inputs.tag }}"
          if [[ -z "$TAG" ]]; then
            TAG="$VERSION"
          fi
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "image=$IMAGE"
          } >> "$GITHUB_OUTPUT"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            clang \
            cmake \
            libasound2-dev \
            libatk1.0-dev \
            libcairo2-dev \
            libgdk-pixbuf-2.0-dev \
            libgtk-3-dev \
            libpango1.0-dev \
            libssl-dev \
            libudev-dev \
            libxdo-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.WASM_TARGET }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen CLI
        run: |
          WASM_BINDGEN_VERSION="$(awk -F' *= *' '/^wasm-bindgen = / {gsub(/"/,"",$2); print $2; exit}' Cargo.toml)"
          cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked

      - name: Build WebUI WASM assets
        run: make webui-wasm

      - name: Build klaw binary
        run: cargo build --release -p klaw-cli

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        shell: bash
        run: |
          TAGS=(
            "-t" "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
            "-t" "${{ steps.meta.outputs.image }}:sha-${GITHUB_SHA::12}"
          )
          if [[ "${{ inputs.push_latest }}" == "true" ]]; then
            TAGS+=("-t" "${{ steps.meta.outputs.image }}:latest")
          fi

          docker buildx build \
            --push \
            --file docker/Dockerfile \
            --build-arg KLAW_BINARY=target/release/klaw \
            "${TAGS[@]}" \
            .
